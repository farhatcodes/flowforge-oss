name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      FLOWFORGE_TEST_DATABASE_URL: postgres://postgres:flowforge@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test -race ./...
      - run: go vet ./...
